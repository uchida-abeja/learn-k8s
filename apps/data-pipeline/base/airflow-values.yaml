dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

scheduler:
  extraVolumes:
    - name: dags-volume
      configMap:
        name: airflow-dags
  extraVolumeMounts:
    - name: dags-volume
      mountPath: /opt/airflow/dags/pipeline.py
      subPath: pipeline.py

workers:
  extraVolumes:
    - name: dags-volume
      configMap:
        name: airflow-dags
  extraVolumeMounts:
    - name: dags-volume
      mountPath: /opt/airflow/dags/pipeline.py
      subPath: pipeline.py

webserver:
  extraVolumes:
    - name: dags-volume
      configMap:
        name: airflow-dags
  extraVolumeMounts:
    - name: dags-volume
      mountPath: /opt/airflow/dags/pipeline.py
      subPath: pipeline.py
  defaultUser:
    enabled: true

# レンダリングごとのランダム生成を避け、SealedSecretから作られる固定Secretを使う。
fernetKeySecretName: airflow-runtime-secrets
webserverSecretKeySecretName: airflow-runtime-secrets

# Executor設定
executor: CeleryExecutor

# Redis設定 - Celery Executorに必要
redis:
  enabled: true
  passwordSecretName: airflow-runtime-secrets

# ArgoCD経由のデプロイではHelm hooksを無効化
migrateDatabaseJob:
  enabled: true
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded

createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/sync-options: Replace=true
  # 通常のGit管理リソースとして残すため、完了後の自動削除を無効にする。
  ttlSecondsAfterFinished: null
  command:
    - bash
    - -c
  args:
    - |-
      exec airflow users create \
        --role Admin \
        --username "${AIRFLOW_ADMIN_USERNAME}" \
        --email admin@example.com \
        --firstname admin \
        --lastname user \
        --password "${AIRFLOW_ADMIN_PASSWORD}"
  env:
    - name: AIRFLOW_ADMIN_USERNAME
      valueFrom:
        secretKeyRef:
          name: airflow-credentials
          key: admin-username
    - name: AIRFLOW_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: airflow-credentials
          key: admin-password

data:
  brokerUrlSecretName: airflow-runtime-secrets
  metadataConnection:
    host: airflow-postgresql

# REST API認証設定 - Basic認証を有効化
config:
  api:
    auth_backends: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
  core:
    # 新規DAGをデフォルトでunpause状態にする
    dags_are_paused_at_creation: "False"

postgresql:
  image:
    repository: postgres
    tag: "13"
