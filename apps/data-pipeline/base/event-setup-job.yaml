apiVersion: batch/v1
kind: Job
metadata:
  name: minio-event-setup
  labels:
    app: minio-event-setup
spec:
  template:
    metadata:
      labels:
        app: minio-event-setup
    spec:
      restartPolicy: OnFailure
      serviceAccountName: minio-sa
      containers:
      - name: setup-events
        image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          echo "Waiting for MinIO to be ready..."
          attempt=1
          until mc alias set myminio http://minio:9000 \
            "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}" \
            && mc ready myminio
          do
            if [ "${attempt}" -ge 60 ]; then
              echo "MinIO did not become ready after 60 attempts." >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 2
          done

          echo "Creating buckets if not exist..."
          mc mb myminio/raw-data --ignore-existing
          mc mb myminio/processed-data --ignore-existing

          echo "Verifying buckets..."
          mc ls myminio/raw-data
          mc ls myminio/processed-data

          echo "Setting up bucket event notification..."
          if ! mc event list myminio/raw-data \
            | grep -Fq 'arn:minio:sqs::PRIMARY:webhook'; then
            mc event add myminio/raw-data \
              arn:minio:sqs::PRIMARY:webhook \
              --event put \
              --suffix .mcap
          fi

          echo "Verifying event notification..."
          mc event list myminio/raw-data

          echo "Setup completed successfully!"
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: rootUser
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: rootPassword
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 100m
