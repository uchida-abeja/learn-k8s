# apps/simple-go-app/overlays/dev/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: simple-go-app-dev

resources:
- ../../base
- namespace.yaml

# dev環境固有のパッチ（必要に応じて）
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: simple-go-app.local
  target:
    kind: Ingress
    name: simple-go-app

images:
- name: simple-go-app-image
  newName: ghcr.io/uchida-abeja/simple-go-app
  newTag: a5117d5f454fb335d66350e5d5f115be79ed2ec2
